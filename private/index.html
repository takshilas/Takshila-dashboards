<style>
  :root {
    --bg:#FFFFFF; --ink:#210235; --body:#000000; --muted:#5b5266; --line:#E7E2EC; --soft:#F7F4FA;
    --britax:#C231FF; --comp:#1F22B2; --sec:#5AAFFE; --up:#B42318; --down:#067647; --amber:#B54708; --amberbg:#FFF4E5; --greenbg:#E8F6EE; --bluebg:#EAF4FF;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; scroll-padding-top:76px; }
  body { margin:0; background:var(--bg); color:var(--body); font-family:'DM Sans',system-ui,sans-serif; font-size:15px; line-height:1.5; }
  main { max-width:1180px; margin:0 auto; padding:24px 16px 72px; }
  h1 { color:var(--ink); font-size:30px; line-height:1.15; margin:0 0 6px; font-weight:700; }
  h2 { color:var(--ink); font-size:20px; line-height:1.25; margin:0 0 4px; font-weight:700; }
  h3 { color:var(--ink); font-size:15px; margin:18px 0 6px; font-weight:700; }
  p { margin:0 0 8px; }
  code, li { overflow-wrap:anywhere; }
  .eyebrow { color:var(--britax); font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px; }
  .sub { color:var(--muted); margin:0 0 14px; }
  .muted { color:var(--muted); }
  .bar { position:sticky; top:0; z-index:5; background:rgba(255,255,255,.96); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); margin:0 -16px; padding:10px 16px; }
  .bar-in { max-width:1180px; margin:0 auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .tabs { display:flex; flex-wrap:wrap; gap:8px; }
  .tab { border:1px solid var(--line); background:#fff; color:var(--ink); padding:7px 13px; border-radius:999px; font:inherit; cursor:pointer; }
  .tab[aria-selected="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
  .tab:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline:2px solid var(--sec); outline-offset:2px; }
  nav.jump { display:flex; gap:12px; flex-wrap:wrap; font-size:13px; margin-left:auto; }
  nav.jump a { color:var(--comp); text-decoration:none; }
  nav.jump a:hover { text-decoration:underline; }
  .asof { display:inline-block; background:var(--soft); border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-size:12.5px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px; margin-top:14px; }
  .qcard { border:1px solid var(--line); border-radius:12px; padding:16px; background:#fff; display:flex; flex-direction:column; gap:6px; }
  .qcard .q { color:var(--muted); font-size:12.5px; font-weight:500; }
  .qcard .a { color:var(--ink); font-size:18px; font-weight:700; line-height:1.3; }
  .qcard .d { font-size:13.5px; }
  .qcard a.more { font-size:13px; color:var(--comp); margin-top:auto; }
  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:700; }
  .pill.hold { background:var(--greenbg); color:var(--down); }
  .pill.watch { background:var(--amberbg); color:var(--amber); }
  .pill.lower { background:#FDECEC; color:var(--up); }
  .pill.neutral { background:var(--soft); color:var(--muted); }
  .pill.amber { background:var(--amberbg); color:var(--amber); }
  .pill.green { background:var(--greenbg); color:var(--down); }
  .pill.blue { background:var(--bluebg); color:var(--comp); }
  .pill.clear { background:var(--soft); color:var(--muted); }
  section.card { border:1px solid var(--line); border-radius:12px; padding:18px; margin-top:18px; background:#fff; }
  .qtext { color:var(--britax); font-weight:700; font-size:12px; letter-spacing:.05em; text-transform:uppercase; margin-bottom:2px; }
  .answer { background:var(--soft); border-left:4px solid var(--britax); border-radius:8px; padding:10px 12px; margin:10px 0 12px; }
  .answer b { color:var(--ink); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin:10px 0; }
  .tile { border:1px solid var(--line); border-radius:12px; padding:12px; background:var(--soft); }
  .tile .k { color:var(--muted); font-size:12px; }
  .tile .v { color:var(--ink); font-size:24px; font-weight:700; line-height:1.2; margin:2px 0; }
  .tile .d { font-size:12px; color:var(--muted); }
  .legend { display:flex; gap:14px; flex-wrap:wrap; margin:8px 0 2px; font-size:13px; color:var(--muted); align-items:center; }
  .legend i { display:inline-block; width:18px; height:3px; border-radius:2px; margin-right:6px; vertical-align:middle; }
  .legend .sw { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:middle; }
  .legend label { cursor:pointer; user-select:none; }
  .chartwrap { position:relative; }
  svg text { font-family:'DM Sans',system-ui,sans-serif; }
  .tip { position:absolute; pointer-events:none; background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12px; box-shadow:0 4px 14px rgba(33,2,53,.12); display:none; min-width:170px; z-index:2; }
  .tip b { color:var(--ink); }
  .tbl { width:100%; border-collapse:collapse; font-size:13.5px; }
  .tbl th, .tbl td { padding:7px 10px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; vertical-align:middle; }
  .tbl th:first-child, .tbl td:first-child, .tbl .l { text-align:left; }
  .tbl th { color:var(--muted); font-weight:500; font-size:12px; position:sticky; top:0; background:#fff; }
  .tbl th button { all:unset; cursor:pointer; color:inherit; }
  .tbl th button:hover { color:var(--ink); }
  .tbl th button:focus-visible { outline:2px solid var(--sec); outline-offset:2px; }
  .tbl tr.me td { background:#FAF0FF; font-weight:700; }
  .tbl tr.all td { background:var(--soft); font-weight:700; }
  .tbl td.wrap { white-space:normal; min-width:200px; text-align:left; }
  .scroll { overflow-x:auto; }
  .up { color:var(--up); } .down { color:var(--down); }
  .dv { display:inline-flex; align-items:center; width:120px; height:12px; vertical-align:middle; margin-left:8px; position:relative; }
  .dv i { position:absolute; top:0; height:12px; border-radius:2px; }
  .dv:before { content:''; position:absolute; left:50%; top:-2px; bottom:-2px; width:1px; background:#9a93a5; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  select, .btn { border:1px solid var(--line); border-radius:8px; padding:7px 10px; font:inherit; background:#fff; color:var(--ink); }
  .btn { cursor:pointer; background:var(--ink); border-color:var(--ink); color:#fff; }
  .btn.ghost { background:#fff; color:var(--ink); border-color:var(--line); }
  ul.notes { margin:6px 0 0 18px; padding:0; }
  ul.notes li { margin:4px 0; }
  .note { background:#FFF7E6; border:1px solid #F2D9A6; border-radius:10px; padding:9px 12px; font-size:13px; margin-top:10px; }
  .flagrow { display:flex; gap:8px; align-items:flex-start; margin:6px 0; font-size:13.5px; }
  .empty { color:var(--muted); padding:14px 0; }
  .rule { font-size:13px; color:var(--muted); margin-top:8px; }
  @media (max-width:600px) { h1 { font-size:23px; } .tile .v { font-size:21px; } nav.jump { display:none; } .grid { grid-template-columns:1fr; } }
